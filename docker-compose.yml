services:
  rails:
    build: .
    container_name: rails
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/src   
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: turStar
    ports:
      - "5433:5432"