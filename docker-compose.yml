services:
  rails:
    build: .
    env_file:
      - .env
    container_name: rails
    ports:
      - "3000:3000"
    volumes:
      - ./src:/src   
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: turStar
    ports:
      - "5433:5432"